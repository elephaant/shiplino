# Release builds. The web app must be built first (`make ui`) so it is
# embedded into the binary; the release workflow does that.
version: 2
project_name: shiplino

builds:
  - id: shiplino
    main: ./cmd/shiplino
    binary: shiplino
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, NOTICE, README.md, CHANGELOG.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless signing: the signature is bound to this repository's release
# workflow identity through Sigstore. Nothing secret to store or leak.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]

# Homebrew cask (macOS and Linux) and Scoop manifest (Windows), pushed to
# their own repositories on each release. Both need HOMEBREW_TAP_TOKEN, a
# token that can write to those two repositories. Without it the files are
# still generated in dist/ but not pushed, and the release succeeds. See
# docs/releasing.md.
homebrew_casks:
  - name: shiplino
    binaries: [shiplino]
    homepage: https://github.com/elephaant/shiplino
    description: Flight recorder and kanban board for AI coding agents
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_TOKEN" "" }}false{{ else }}true{{ end }}'
    repository:
      owner: elephaant
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    commit_msg_template: "shiplino {{ .Tag }}"
    caveats: |
      Run `shiplino setup` to connect your agents and start the board at http://localhost:4777.
      After `brew upgrade --cask shiplino`, run `shiplino setup` again so the hooks use the new version.
    # The binary isn't notarized by Apple, so Gatekeeper would refuse the
    # quarantined download. Homebrew has already verified its SHA-256.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/shiplino"]
          end

scoops:
  - name: shiplino
    homepage: https://github.com/elephaant/shiplino
    description: Flight recorder and kanban board for AI coding agents
    license: Apache-2.0
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_TOKEN" "" }}false{{ else }}true{{ end }}'
    repository:
      owner: elephaant
      name: scoop-bucket
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    commit_msg_template: "shiplino {{ .Tag }}"

release:
  github:
    owner: elephaant
    name: shiplino
  prerelease: auto
  header: |
    Install or upgrade:

    ```sh
    curl -fsSL https://raw.githubusercontent.com/elephaant/shiplino/main/scripts/install.sh | sh
    ```

    Windows (PowerShell): `irm https://raw.githubusercontent.com/elephaant/shiplino/main/scripts/install.ps1 | iex`

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^.*?(feat|setup|service|cli|projects|board|web|git|transcript|privacy|cost|api|adapter)'
      order: 0
    - title: Fixes
      regexp: '^.*?fix'
      order: 1
    - title: Other
      order: 99
