name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # keyless signing with Sigstore

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test
        run: go test ./...
      - name: Build the web app (embedded into the binary)
        run: make ui
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: pushes the Homebrew cask and Scoop manifest. Empty
          # (secret not set) skips that step; see docs/releasing.md.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # The generated cask and manifest, also when they weren't pushed.
      - uses: actions/upload-artifact@v7
        with:
          name: package-manifests
          path: |
            dist/homebrew/
            dist/scoop/

  # A release made with GITHUB_TOKEN doesn't trigger other workflows, so
  # npm publishing is called from here. It skips itself without NPM_TOKEN.
  npm:
    needs: release
    uses: ./.github/workflows/npm.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
